# Staging frontend on Workers Static Assets (no Worker script: Cloudflare
# serves dist/ directly, applies dist/_headers, and falls back to index.html
# for client-side routes). Production uses the same setup
# (wrangler.web-production.toml, DEPLOYMENT.md "Production preparation").
# Build first with the staging API and Supabase values and
# VITE_AUTH_REDIRECT_ORIGIN set to the staging origin (DEPLOYMENT.md §5), then:
#   backend/node_modules/.bin/wrangler deploy -c wrangler.web-staging.toml
name = "vectorla-web-staging"
compatibility_date = "2026-01-01"

[assets]
directory = "./dist"
not_found_handling = "single-page-application"
