name = "vectorla-api"
main = "src/index.ts"
compatibility_date = "2026-01-01"

# R2 bucket binding — create the bucket with:
#   wrangler r2 bucket create vectorla-uploads
[[r2_buckets]]
binding = "UPLOADS_BUCKET"
bucket_name = "vectorla-uploads"

# Queue producer — create the queue with:
#   wrangler queues create vectorla-conversions
[[queues.producers]]
queue = "vectorla-conversions"
binding = "CONVERSION_QUEUE"

# This same Worker also consumes the queue it produces to. One message per
# invocation: tracing is CPU-heavy, and a batch shares one CPU budget.
# Failed messages retry up to max_retries times (the consumer applies its
# own backoff and lease delays, see src/queueConsumer.ts), then move to the
# dead-letter queue — create it with:
#   wrangler queues create vectorla-conversions-dlq
[[queues.consumers]]
queue = "vectorla-conversions"
max_batch_size = 1
max_batch_timeout = 5
max_retries = 6
dead_letter_queue = "vectorla-conversions-dlq"

# Dead-lettered jobs are failed and their credits refunded.
[[queues.consumers]]
queue = "vectorla-conversions-dlq"
max_batch_size = 10
max_batch_timeout = 30

# Stale-job sweeper (src/queueConsumer.ts sweepStaleJobs): backstop for
# lost messages — fails and refunds jobs stuck far past any real run.
[triggers]
crons = ["*/15 * * * *"]

# Tracing takes seconds of CPU; the default 30 s leaves too little headroom
# for 2 MP Professional traces on slow isolates. Requires the Workers Paid
# plan (Free allows 10 ms CPU per invocation). JOB_LEASE_MS (5 min) must stay above it.
[limits]
cpu_ms = 60000

# Per-client-IP request limit (Cloudflare Workers Rate Limiting) — REQUIRES
# OWNER APPROVAL before enabling (DEPLOYMENT.md "Launch checklist"). Until it
# is enabled the code runs without it (env.ts API_RATE_LIMITER is optional);
# the per-user upload/quota/concurrency limits apply either way. Pick an
# account-unique namespace_id when enabling:
# [[ratelimits]]
# name = "API_RATE_LIMITER"
# namespace_id = "1001"
# simple = { limit = 120, period = 60 }

[vars]
# Safe deployment default. `npm run dev` overrides this value explicitly;
# staging has its own environment block at the end of this file.
ENVIRONMENT = "production"
# Default vectorization backend for createVectorizationProvider (see
# src/providers/ProviderFactory.ts). Per-job dispatch (ConversionService) uses
# ProviderSelector, which routes every image to the Vectorla engine
# (src/engine/) with the ImageTracer engine ("placeholder") as fallback.
VECTORIZATION_PROVIDER = "vectorla"

# WASM raster decoders (Phase 19) — jSquash's codecs, built for exactly this
# (Cloudflare Workers/edge runtimes). `[wasm_modules]`/`[[wasm_modules]]`
# bindings only work for the legacy Service Worker format — this Worker uses
# the ES modules format (`export default { fetch, queue }`), where workerd
# requires Wasm to be a direct ES import instead (see src/index.ts, which
# imports these same three files and merges them onto env as
# PNG_DECODER_WASM etc. before delegating to routes/services).

# Supabase credentials, and the download-URL signing key, are secrets, not vars — set them with:
#   wrangler secret put SUPABASE_URL
#   wrangler secret put SUPABASE_SERVICE_ROLE_KEY
#   wrangler secret put DOWNLOAD_URL_SECRET
# For local `wrangler dev`, copy .dev.vars.example to .dev.vars instead.

# --- Staging -----------------------------------------------------------------
# Deploy with: npx wrangler deploy --env staging
# A separate Worker with its own bucket, queues and secrets, so staging can
# never touch production data. Create its resources once with:
#   wrangler r2 bucket create vectorla-uploads-staging
#   wrangler queues create vectorla-conversions-staging
#   wrangler queues create vectorla-conversions-staging-dlq
#   wrangler secret put SUPABASE_URL --env staging   (and the other secrets)
[env.staging]
name = "vectorla-api-staging"

# Staging rate limiter (enabled; production's block above stays off until
# the production release is approved):
[[env.staging.ratelimits]]
name = "API_RATE_LIMITER"
namespace_id = "1002"
simple = { limit = 120, period = 60 }

[env.staging.vars]
ENVIRONMENT = "staging"
VECTORIZATION_PROVIDER = "vectorla"
# Exact https origin(s) of the staging frontend (comma-separated), e.g.
# "https://staging.<pages-project>.pages.dev". Required before staging can be
# used from a browser: CORS otherwise only allows https://vectorla.app.
CORS_EXTRA_ORIGINS = ""

[[env.staging.r2_buckets]]
binding = "UPLOADS_BUCKET"
bucket_name = "vectorla-uploads-staging"

[[env.staging.queues.producers]]
queue = "vectorla-conversions-staging"
binding = "CONVERSION_QUEUE"

[[env.staging.queues.consumers]]
queue = "vectorla-conversions-staging"
max_batch_size = 1
max_batch_timeout = 5
max_retries = 6
dead_letter_queue = "vectorla-conversions-staging-dlq"

[[env.staging.queues.consumers]]
queue = "vectorla-conversions-staging-dlq"
max_batch_size = 10
max_batch_timeout = 30

[env.staging.triggers]
crons = ["*/15 * * * *"]
